<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture · Chris Le</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div>
        <h1 class="title" id="title">Architecture</h1>
        <p class="intro" id="intro"></p>
      </div>
      <button class="theme-toggle" type="button">light mode</button>
    </div>
    <div id="banner"></div>
    <div id="diagram"></div>
    <div id="legend"></div>
    <p class="footer-note"><a href="./" target="_blank" rel="noopener">← map of my work</a></p>
  </main>
  <script src="assets/diagram.js"></script>
  <script>
    WorkMap.wireThemeToggle();
    var name = new URLSearchParams(location.search).get("spec") || "";
    if (!/^[a-z0-9-]+$/.test(name)) {
      document.getElementById("diagram").innerHTML = '<p class="error">Add ?spec=name to the URL, matching a file in specs/.</p>';
    } else {
      WorkMap.load("specs/" + name + ".json").then(function (spec) {
        document.title = spec.title + " · Chris Le";
        document.getElementById("title").textContent = spec.title;
        document.getElementById("intro").textContent = spec.intro || "";
        if (spec.draft) {
          var b = WorkMap.el("div", "banner", "Draft: components on this diagram are placeholders until confirmed.");
          document.getElementById("banner").appendChild(b);
        }
        WorkMap.renderDiagram(document.getElementById("diagram"), spec, { mode: "arch" });
        document.getElementById("legend").appendChild(WorkMap.legend(spec));
      }).catch(function (err) {
        document.getElementById("diagram").innerHTML = '<p class="error">Could not load specs/' + name + '.json (' + err.message + ').</p>';
      });
    }
  </script>
</body>
</html>
