<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chris Le · Map of my work</title>
  <meta name="description" content="Systems Chris Le has built, from deep-space networking to production data pipelines.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div>
        <h1 class="title">Chris Le · map of my work</h1>
        <p class="intro" id="intro"></p>
      </div>
      <button class="theme-toggle" type="button">light mode</button>
    </div>
    <div id="map" aria-label="Map of projects. Each project opens its case study in a new tab."></div>
    <div id="legend"></div>
    <p class="footer-note">
      <a href="https://github.com/chrishoangle" target="_blank" rel="noopener">github.com/chrishoangle</a>
    </p>
  </main>
  <script src="assets/diagram.js"></script>
  <script>
    WorkMap.wireThemeToggle();
    WorkMap.load("projects.json").then(function (spec) {
      document.getElementById("intro").textContent = spec.intro || "";
      WorkMap.renderDiagram(document.getElementById("map"), spec, { mode: "map", archPage: "arch.html" });
      document.getElementById("legend").appendChild(WorkMap.legend(spec));
    }).catch(function (err) {
      var m = document.getElementById("map");
      m.innerHTML = '<p class="error">Could not load projects.json (' + err.message + '). If you opened this file directly, serve the folder instead, for example: python3 -m http.server</p>';
    });
  </script>
</body>
</html>
