<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture · Chris Le</title>
  <script>
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t !== 'light' && t !== 'dark') { try { t = localStorage.getItem('workmap-theme'); } catch (e) {} }
      document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/workmap.css">
</head>
<body>
  <main class="page">
    <header class="page-head">
      <div>
        <p class="kicker">Architecture</p>
        <h1 class="page-title" id="title">Loading…</h1>
        <p class="summary" id="summary"></p>
      </div>
      <button type="button" class="theme-toggle" data-theme-toggle>☀ light</button>
    </header>

    <div id="map" aria-describedby="summary"></div>
    <div class="legend" id="legend" role="note"></div>
  </main>

  <script src="assets/workmap.js"></script>
  <script>
    WorkMap.initTheme();
    var mapEl = document.getElementById('map');
    var titleEl = document.getElementById('title');
    var p = new URLSearchParams(location.search).get('p');

    if (p && /^[a-z0-9-]+$/.test(p)) {
      WorkMap.loadJSON('specs/' + p + '.json').then(function (spec) {
        titleEl.textContent = spec.title || p;
        document.title = (spec.title || p) + ' · Architecture';
        document.getElementById('summary').textContent = spec.summary || '';
        WorkMap.render(mapEl, spec);
        WorkMap.renderLegend(document.getElementById('legend'), spec);
      }).catch(function (err) { titleEl.textContent = 'Diagram not found'; WorkMap.showError(mapEl, err); });
    } else {
      // No ?p= given: list every project in projects.json that has a diagram.
      titleEl.textContent = 'Architecture diagrams';
      WorkMap.loadJSON('projects.json').then(function (spec) {
        var list = document.createElement('ul');
        list.className = 'diagram-index';
        spec.nodes.filter(function (n) { return n.diagram; }).forEach(function (n) {
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = 'diagram.html?p=' + encodeURIComponent(n.diagram);
          a.textContent = n.title;
          li.appendChild(a);
          list.appendChild(li);
        });
        mapEl.appendChild(list);
      }).catch(function (err) { WorkMap.showError(mapEl, err); });
    }
  </script>
</body>
</html>
