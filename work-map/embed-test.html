<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embed test (900px iframe)</title>
  <style>
    body { margin: 0; padding: 24px; background: #7a7f87; font: 13px system-ui, sans-serif; color: #fff; }
    iframe { display: block; width: 900px; max-width: 100%; height: 600px; border: 0; margin: 12px 0 32px; }
  </style>
</head>
<body>
  <p>Landing map at 900px (roughly what a full-width Notion embed looks like)</p>
  <iframe src="index.html" title="Work map"></iframe>
  <p>Architecture diagram at 900px</p>

</body>
</html>
