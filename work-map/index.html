<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chris Le · Work Map</title>
  <meta name="description" content="An interactive map of systems Chris Le has built, from deep-space networking to production data pipelines.">
  <script>
    // Theme before first paint: ?theme= wins, then saved choice, then dark.
    (function () {
      var t = new URLSearchParams(location.search).get('theme');
      if (t !== 'light' && t !== 'dark') { try { t = localStorage.getItem('workmap-theme'); } catch (e) {} }
      document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/workmap.css">
</head>
<body>
  <main class="page">
    <header class="page-head">
      <div>
        <p class="kicker">Chris Le · work map</p>
        <p class="intro" id="intro">Systems I've built, from deep-space networking to production data pipelines. Click any node for the case study.</p>
      </div>
      <button type="button" class="theme-toggle" data-theme-toggle>☀ light</button>
    </header>

    <div id="map" aria-describedby="intro"></div>
    <div class="legend" id="legend" role="note"></div>
  </main>

  <script src="assets/workmap.js"></script>
  <script>
    WorkMap.initTheme();
    var mapEl = document.getElementById('map');
    WorkMap.loadJSON('projects.json').then(function (spec) {
      if (spec.intro) document.getElementById('intro').textContent = spec.intro;
      WorkMap.render(mapEl, spec);
      WorkMap.renderLegend(document.getElementById('legend'), spec);
    }).catch(function (err) { WorkMap.showError(mapEl, err); });
  </script>
</body>
</html>
